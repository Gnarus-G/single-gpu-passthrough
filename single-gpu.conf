# /etc/libvirt/hooks/single-gpu.conf
# Use the exact libvirt domain name shown by: virsh list --all
VM_NAME="win11"

# Check the alias with: systemctl status display-manager.service
# Replace this if your display manager has no display-manager.service alias.
DISPLAY_MANAGER="display-manager.service"

# Optional: wait for this GPU's own DRM device before restarting the display manager.
GPU_PCI_ADDRESS=""
GPU_READY_TIMEOUT=10

# Optional raw guest disks. Every partition must be unmounted on the host.
# REQUIRED_UNMOUNTED_DISKS=("/dev/disk/by-id/replace-with-your-disk-id")
REQUIRED_UNMOUNTED_DISKS=()
